set -g mouse on

# Navigate Neovim windows and tmux panes with the same Ctrl+h/j/k/l keys.
# https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode C-h select-pane -L
bind-key -T copy-mode C-j select-pane -D
bind-key -T copy-mode C-k select-pane -U
bind-key -T copy-mode C-l select-pane -R

# Prefix then Ctrl+l still clears the shell screen.
bind-key C-l send-keys C-l

# TokyoNight Moon — matches the configured LazyVim colorscheme.
# Palette: ~/.local/share/nvim/lazy/tokyonight.nvim/lua/tokyonight/colors/moon.lua
set -as terminal-features ',xterm*:RGB'

# Default pane colors, including shells that use the terminal's default colors.
set -g window-style 'fg=#c8d3f5,bg=#222436'
set -g window-active-style 'fg=#c8d3f5,bg=#222436'
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#c099ff'

set -g status-style 'fg=#828bb8,bg=#1e2030'
set -g status-left-style 'default'
set -g status-right-style 'default'
set -g status-left-length 40
set -g status-right-length 60
set -g status-left '#[fg=#222436,bg=#c099ff,bold] #S #[default] '
set -g status-right '#[fg=#c099ff]#{?client_prefix, PREFIX ,}#[fg=#828bb8]%a %H:%M #[fg=#c8d3f5] #h '
set -g window-status-separator ' '
set -g window-status-style 'fg=#828bb8,bg=#1e2030'
set -g window-status-format ' #I: #W#{?window_flags, #F,} '
set -g window-status-current-style 'fg=#c099ff,bg=#2f334d,bold'
set -g window-status-current-format ' #I: #W#{?window_flags, #F,} '
set -g window-status-activity-style 'fg=#ffc777,bg=#1e2030'
set -g window-status-bell-style 'fg=#ff757f,bg=#1e2030,bold'

set -g message-style 'fg=#c8d3f5,bg=#3b4261'
set -g message-command-style 'fg=#c099ff,bg=#3b4261'
set -g mode-style 'fg=#c8d3f5,bg=#3b4261'
set -g clock-mode-colour '#c099ff'
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',xterm*:extkeys'
